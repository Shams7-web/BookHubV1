{% extends "base.html" %}

{% block title %}BookHub - Add New Book{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Add New Book</h1>

    {% if errors %}
    <div class="alert alert-danger">
        <ul class="mb-0">
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_book') }}" class="row g-3">
        <div class="col-md-6">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ form.get('title', '') }}">
        </div>

        <div class="col-md-6">
            <label for="author" class="form-label">Author</label>
            <input type="text" class="form-control" id="author" name="author" value="{{ form.get('author', '') }}">
        </div>

        <div class="col-md-6">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category" value="{{ form.get('category', '') }}">
        </div>

        <div class="col-md-6">
            <label for="price" class="form-label">Price</label>
            <input type="text" class="form-control" id="price" name="price" value="{{ form.get('price', '') }}">
        </div>

        <div class="col-12">
            <label for="image_url" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="image_url" name="image_url" value="{{ form.get('image_url', '') }}">
        </div>

        <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ form.get('description', '') }}</textarea>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save Book</button>
            <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
