{% extends "base.html" %}

{% block title %}BookHub - Add New Book{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Add New Book</h1>

    {% if errors %}
    <div class="alert alert-danger">
        <ul class="mb-0">
            {% for error in errors %}
            <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_book') }}" enctype="multipart/form-data" class="row g-3">
        <div class="col-md-6">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ form.get('title', '') }}">
        </div>

        <div class="col-md-6">
            <label for="author" class="form-label">Author</label>
            <input type="text" class="form-control" id="author" name="author" value="{{ form.get('author', '') }}">
        </div>

        <div class="col-md-6">
            <label for="category" class="form-label">Category</label>
            <input type="text" class="form-control" id="category" name="category" value="{{ form.get('category', '') }}">
        </div>

        <div class="col-md-6">
            <label for="price" class="form-label">Price</label>
            <input type="text" class="form-control" id="price" name="price" value="{{ form.get('price', '') }}">
        </div>

        <div class="col-md-6">
            <label for="stock" class="form-label">Stock Quantity</label>
            <input type="number" min="0" step="1" class="form-control" id="stock" name="stock" value="{{ form.get('stock', '0') }}">
        </div>

        <div class="col-md-6">
            <label for="low_stock_threshold" class="form-label">Low Stock Threshold</label>
            <input type="number" min="0" step="1" class="form-control" id="low_stock_threshold" name="low_stock_threshold" value="{{ form.get('low_stock_threshold', '5') }}">
        </div>

        <div class="col-12">
            <label for="cover_image" class="form-label">Cover Image (JPG, JPEG, or PNG)</label>
            <input type="file" class="form-control" id="cover_image" name="cover_image" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
        </div>

        <div class="col-12">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4">{{ form.get('description', '') }}</textarea>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-primary">Save Book</button>
            <a href="{{ url_for('admin') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
